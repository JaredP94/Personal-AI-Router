# Adapted from NVIDIA/Personal-AI-Router@b4a0cc5. PR code runs only on
# disposable GitHub-hosted runners, without secrets or release automation.
name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    GOTOOLCHAIN: local

jobs:
    headers:
        name: SPDX headers
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v5.0.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v5.0.0
              with:
                  node-version: '25.5.0'
            - run: node scripts/spdx-headers.mjs

    desktop:
        name: Desktop checks
        runs-on: ubuntu-latest
        timeout-minutes: 15
        defaults:
            run:
                working-directory: desktop
        steps:
            - uses: actions/checkout@v5.0.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v5.0.0
              with:
                  node-version: '25.5.0'
                  cache: npm
                  cache-dependency-path: desktop/package-lock.json
            - run: npm ci --prefer-offline
            - run: npm run typecheck
            - run: npm run lint -- --max-warnings=0
            - run: npm run test:unit
            - run: npm run dead-code:check
            - run: npm run service-contracts:check
            - run: npm run licenses:check

    services:
        name: Go modules (${{ matrix.os }})
        # macos-latest is the standard arm64 hosted runner, not macos-*-intel.
        runs-on: ${{ matrix.os }}
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, ubuntu-latest]
        steps:
            - uses: actions/checkout@v5.0.0
              with:
                  persist-credentials: false
            - uses: actions/setup-go@v6.0.0
              with:
                  go-version: '1.26.7'
                  cache-dependency-path: services/**/go.sum
            - name: Linux test tools
              if: runner.os == 'Linux'
              run: sudo apt-get update -qq && sudo apt-get install -y -qq lsof iproute2
            - name: Check Go formatting
              shell: bash
              run: |
                  unformatted=$(gofmt -l services)
                  if [ -n "$unformatted" ]; then
                      printf '%s\n' "$unformatted"
                      exit 1
                  fi
            - name: Vet and test every service module (including libraries)
              shell: bash
              run: |
                  failed=0
                  for mod in services/*/go.mod; do
                      dir=$(dirname "$mod")
                      # Cross-process tests run only on macOS in their own job.
                      if [ "$dir" = services/tests ]; then continue; fi
                      echo "==> $dir"
                      (cd "$dir" && go vet ./... && go test -count=1 -timeout=5m ./...) || failed=1
                  done
                  exit "$failed"

    cross-process:
        name: Cross-process tests (macOS arm64)
        runs-on: macos-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v5.0.0
              with:
                  persist-credentials: false
            - uses: actions/setup-go@v6.0.0
              with:
                  go-version: '1.26.7'
                  cache-dependency-path: services/**/go.sum
            # Run the source guard before executing any application binary.
            # All runtime helpers must use per-test disposable app-data roots.
            - name: Check process isolation
              working-directory: services/tests
              run: go test -count=1 -run '^Test(ProcessHelpersRequireIsolation|CommandEnvironmentIsPerTest)$' .
            - name: Vet and run isolated cross-process suite
              working-directory: services/tests
              run: go vet ./... && go test -count=1 -timeout=15m ./...
